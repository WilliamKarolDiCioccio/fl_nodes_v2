name: fl_nodes_v2
description: "A node graph editor for Flutter: pan, zoom, wire and run graphs, with ordinary Flutter widgets inside every node."
version: 0.4.0
repository: https://github.com/WilliamKarolDiCioccio/fl_nodes_v2
platforms:
  web:
  linux:
  windows:
  macos:
funding:
  - https://buymeacoffee.com/Wilielmus

environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  shaders:
    - lib/shaders/grid.frag
